                  "text": "Most US DSCR (Debt Service Coverage Ratio) mortgage lenders require a minimum DSCR of 1.20x to 1.25x for their best interest rates, meaning the property's gross monthly rent is at least 120% to 125% of the monthly PITIA (Principal, Interest, Taxes, Insurance, and HOA) payment."

                "name": "How do you calculate Cap Rate vs. Cash-on-Cash Return?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cap Rate equals annual Net Operating Income (NOI) divided by the property's purchase price, measuring unleveraged yield. Cash-on-Cash Return equals annual pre-tax cash flow (after mortgage payments) divided by your total out-of-pocket cash invested (down payment plus closing and rehab costs)."
